# 3D contribution city — renders commits as a night-view skyline.
# Runs daily and on demand. First run: open the Actions tab, enable
# workflows, then run this workflow once. It commits the generated SVG
# into profile-3d-contrib/ in this repo.
# NOTE: pinned to v0.9.3 (node24) + checkout v5 — v1 used 0.7.1 (Node 20),
# whose run reported "Success" but generated nothing under forced Node 24.
# The action only GENERATES the files — the Commit & Push step below is
# what actually saves them to the repo (per the action's own README).
name: 3D Contribution

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: istiakrahman15
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
